name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    name: 逻辑自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:logic

  e2e:
    name: 浏览器端到端自测
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest 自带 google-chrome，tests/browser.test.mjs 会自动探测
      - name: 运行浏览器自测
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      # 日志正文匿名读不到，失败时把尾部写进 job summary（可通过 Checks API 读取）
      - if: failure()
        name: 失败时贴出自测日志尾部
        run: |
          {
            echo '### 浏览器自测失败，日志尾部'
            echo '```text'
            tail -c 6000 "$RUNNER_TEMP/e2e.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: ${{ runner.temp }}/word-review-e2e-*.png
          if-no-files-found: ignore
      # 临时排障：ci-logs 分支可匿名读取，方便在拿不到 job 日志时看失败原因（修好后可删）
      - if: failure()
        name: 把自测日志推到 ci-logs 分支
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-log"
          cp "$RUNNER_TEMP/e2e.log" "$RUNNER_TEMP/ci-log/e2e.log"
          cd "$RUNNER_TEMP/ci-log"
          git init -q
          git checkout -q -b ci-logs
          git add e2e.log
          git -c user.name=ci -c user.email=ci@local commit -q -m "e2e log run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" ci-logs

name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    name: 逻辑自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:logic

  e2e:
    name: 浏览器端到端自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ubuntu-latest 自带 google-chrome，tests/browser.test.mjs 会自动探测
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: ${{ runner.temp }}/word-review-e2e-*.png
          if-no-files-found: ignore

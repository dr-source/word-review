name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    name: 逻辑自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:logic

  e2e:
    name: 浏览器端到端自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest 自带 google-chrome，tests/browser.test.mjs 会自动探测
      - name: 运行浏览器自测
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      # 失败时把日志尾部贴进 job summary，排队/失败原因一眼可见，不必翻整段日志
      - if: failure()
        name: 失败时贴出自测日志尾部
        run: |
          {
            echo '### 浏览器自测失败，日志尾部'
            echo '```text'
            tail -c 6000 "$RUNNER_TEMP/e2e.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: ${{ runner.temp }}/word-review-e2e-*.png
          if-no-files-found: ignore
